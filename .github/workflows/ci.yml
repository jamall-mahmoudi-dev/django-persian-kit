name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2"]
        exclude:
          # Django 5.x needs Python 3.10+
          - python-version: "3.9"
            django-version: "5.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0" pytest pytest-django
      - name: Test
        run: python -m pytest -q
      - name: Doctests
        run: python -m pytest -q --doctest-modules src/persian_kit/digits.py src/persian_kit/jalali.py src/persian_kit/words.py -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
