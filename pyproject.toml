[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-persian-kit"
dynamic = ["version"]
description = "Persian (Farsi) toolkit for Django: Jalali dates, Persian digits, Iranian ID/mobile/card/Sheba validators, number-to-words, fields and template filters."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jamall", email = "jamallmahmoudi2001@gmail.com" }]
keywords = ["django", "persian", "farsi", "jalali", "shamsi", "iran", "validators", "national-id", "sheba"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/jamall-mahmoudi-dev/django-persian-kit.git"
Source = "https://github.com/jamall-mahmoudi-dev/django-persian-kit.git"
Issues = "https://github.com/jamall-mahmoudi-dev/django-persian-kit/issues"
Changelog = "https://github.com/jamall-mahmoudi-dev/django-persian-kit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/persian_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/persian_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/persian_kit", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
